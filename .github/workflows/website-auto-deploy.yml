name: Website Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "csc-pages-deployment"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
      - name: Verify meeting upload extraction
        run: |
          python3 scripts/test_meeting_sync.py
          python3 scripts/test_customer_overviews.py
      - name: Build latest client meeting record links
        run: python3 scripts/build_meeting_index.py
      - name: Extract client follow-up proposals for admin review
        run: python3 scripts/extract_meeting_followups.py
      - name: Verify current Word follow-up display
        run: |
          node scripts/test_followup_view.js
          node scripts/test_profile_topics.js
          node scripts/test_customer_map.js
          node scripts/test_overview_display.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for publication artifact metadata
        run: sleep 5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
