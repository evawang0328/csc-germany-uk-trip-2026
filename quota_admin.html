<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中鋼銷歐額度｜管理者更新工具</title><style>body{font-family:Arial,'Microsoft JhengHei',sans-serif;max-width:1050px;padding:22px;margin:auto;color:#173553;background:#f3f6fb}main{background:white;border:1px solid #dce7f3;border-radius:15px;padding:20px}h1{font-size:24px}label{display:block;margin:12px 0;font-weight:600}input{padding:10px;border:1px solid #b7cadb;border-radius:7px;font:inherit}input[type=number]{width:135px}button{border:0;background:#175782;color:white;border-radius:8px;padding:12px 15px;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:12px;min-width:740px}td,th{padding:10px;border-bottom:1px solid #dce5f0;text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.warning{background:#fff3da;padding:14px;border-radius:8px}.muted{color:#62778b;font-size:13px}.row{display:flex;gap:16px;flex-wrap:wrap}#status{margin:15px 0;color:#165a79}</style></head><body><main><h1>中鋼銷歐額度｜管理者更新工具</h1><p class="warning">本工具在你的電腦上使用，請不要上傳到公開 GitHub；更新後下載新的 eu_quota.json，再上傳覆蓋網站上的同名檔案。輸入欄位 H／I 單位 MT，必須避免重複計數。</p><label>載入目前 GitHub 的 eu_quota.json：<input id="upload" type="file" accept=".json"></label><div class="row"><label>更新人<input id="owner" placeholder="輸入者姓名" required></label><label>更新時間<input id="date" type="datetime-local"></label></div><div class="scroll"><table><thead><tr><th>類別／產品</th><th>實績配額 G（MT）</th><th>在途 H（MT）</th><th>已接單未出貨 I（MT）</th><th>仍可銷售 J（MT）</th></tr></thead><tbody id="rows"><tr><td colspan="5">先匯入 eu_quota.json</td></tr></tbody></table></div><p id="total"></p><label>更新備註<input id="comment" style="width:min(100%,600px)" placeholder="例如業務更新、訂單切換到在途"></label><button id="save">核對後，下載新版 eu_quota.json</button><div id="status" aria-live="polite"></div><p class="muted">網站是唯讀展示；本工具下載檔案後，仍需你到 GitHub 覆蓋舊檔並 Commit，資料才會讓其他同仁看到。公開網站不應上傳此管理工具。</p></main><script>
let data=null;let $=id=>document.getElementById(id);$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
let fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
function draw(){if(!data)return;let total=0;$('rows').innerHTML=data.rows.map((r,i)=>{let j=Number(r.cscQuota)-Number(r.transit||0)-Number(r.undelivered||0);total+=j;return `<tr><td>${r.category} ${r.product}</td><td>${fmt(r.cscQuota)}</td><td><input type="number" step="0.01" min="0" data-row="${i}" data-field="transit" value="${r.transit||0}"></td><td><input type="number" step="0.01" min="0" data-row="${i}" data-field="undelivered" value="${r.undelivered||0}"></td><td style="color:${j<0?'#ba273c':'#155c7c'};font-weight:bold">${fmt(j)}</td></tr>`}).join('');$('total').textContent='仍可銷售額度合計：'+fmt(total)+' MT';document.querySelectorAll('[data-row]').forEach(el=>el.oninput=()=>{let v=Number(el.value);if(!Number.isFinite(v)||v<0){$('status').textContent='數量必須為非負數';return;}data.rows[+el.dataset.row][el.dataset.field]=v;draw();});}
$('upload').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.rows)||!d.rows.every(r=>Number.isFinite(Number(r.cscQuota))))throw Error('不是額度 JSON');data=d;$('owner').value=d.updatedBy?.includes('待填')?'':(d.updatedBy||'');draw();$('status').textContent='已成功匯入目前額度';}catch(e){$('status').textContent='匯入失敗：'+e.message}};
$('save').onclick=()=>{if(!data){$('status').textContent='請先匯入 eu_quota.json';return;}let owner=$('owner').value.trim();if(!owner){$('status').textContent='請輸入更新人';return;}if(!data.rows.every(r=>['transit','undelivered'].every(k=>Number.isFinite(Number(r[k]))&&Number(r[k])>=0))){$('status').textContent='數量不得為負數或無效';return;}let dt=$('date').value;if(!dt){$('status').textContent='請填更新時間';return;}data.updatedAt=dt.replace('T',' ')+' (本地時間)';data.updatedBy=owner;data.version='update-'+dt.replace(/[-:T]/g,'');data.history=(data.history||[]).concat([{at:data.updatedAt,by:owner,comment:$('comment').value,values:data.rows.map(r=>({category:r.category,transit:r.transit,undelivered:r.undelivered}))}]).slice(-50);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eu_quota.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='已下載新版 eu_quota.json，請到 GitHub 覆蓋並 Commit。'};
</script></body></html>
